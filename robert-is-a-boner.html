<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robert Is A Boner</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      text-align: center;
      padding: 2.5rem;
    }
    .emojis-top {
      font-size: 2.8rem;
      letter-spacing: 0.2rem;
      margin-bottom: 1.2rem;
    }
    .headline {
      font-size: clamp(2rem, 7vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #ff4499, #ff0055, #cc0044);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.15;
      margin-bottom: 1.2rem;
    }
    .emojis-mid {
      font-size: 2.5rem;
      letter-spacing: 0.2rem;
      margin-top: 0.5rem;
    }
    .emojis-bot {
      font-size: 1.8rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emojis-top">🍆 🍆 🍆 🍆 🍆</div>
    <div class="headline">ROBERT IS<br>A BONER</div>
    <div class="emojis-mid">🍆 😂 🍑 💀 😏 🍆</div>
    <div class="emojis-bot">💅 🤡 🍆 👀 🎉</div>
  </div>
</body>
</html>
