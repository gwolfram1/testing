<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP – Summer Gala 2027</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: #f0f0f0;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    .badge {
      display: inline-block;
      background: #e94560;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    .event-meta {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: #aab;
    }

    .event-meta span { display: flex; align-items: center; gap: 0.5rem; }
    .event-meta svg { flex-shrink: 0; }

    form { display: flex; flex-direction: column; gap: 1rem; }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #ccd;
      margin-bottom: 0.25rem;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 0.6rem;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input::placeholder { color: #667; }

    input:focus, select:focus {
      border-color: #e94560;
    }

    select option { background: #1a1a2e; color: #f0f0f0; }

    .btn {
      margin-top: 0.5rem;
      padding: 0.9rem 1.5rem;
      background: #e94560;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 0.6rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #c73652; }
    .btn:active { transform: scale(0.98); }

    .success {
      display: none;
      text-align: center;
      padding: 1.5rem 0 0.5rem;
    }

    .success .icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .success h2 { font-size: 1.4rem; margin-bottom: 0.4rem; }
    .success p { color: #aab; font-size: 0.9rem; }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">You're Invited</span>
    <h1>Summer Gala 2027</h1>
    <div class="event-meta">
      <span>
        <svg width="14" height="14" fill="none" stroke="#e94560" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Saturday, July 19, 2027 · 7:00 PM
      </span>
      <span>
        <svg width="14" height="14" fill="none" stroke="#e94560" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        The Grand Ballroom · 123 Elm Street, Springfield
      </span>
    </div>

    <hr class="divider" />

    <form id="rsvp-form" action="https://formspree.io/f/mrppzvzj" method="POST">
      <!-- Formspree hidden fields -->
      <input type="hidden" name="_replyto" id="hidden-email" />
      <input type="hidden" name="_subject" id="hidden-subject" />
      <input type="hidden" name="_next" value="about:blank" />

      <div>
        <label for="name">Full Name</label>
        <input id="name" name="Full Name" type="text" placeholder="Jane Smith" required />
      </div>
      <div>
        <label for="email">Email Address</label>
        <input id="email" name="Email Address" type="email" placeholder="jane@example.com" required />
      </div>
      <div>
        <label for="guests">Number of Guests (including you)</label>
        <select id="guests" name="Number of Guests">
          <option value="1">1 – Just me</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5+">5 or more</option>
        </select>
      </div>
      <div>
        <label for="dietary">Dietary Requirements (optional)</label>
        <input id="dietary" name="Dietary Requirements" type="text" placeholder="e.g. vegetarian, gluten-free" />
      </div>
      <button class="btn" type="submit">Confirm My RSVP</button>
    </form>

    <div class="success" id="success">
      <div class="icon">🎉</div>
      <h2>You're on the list!</h2>
      <p id="success-msg">We'll send a confirmation to your email.</p>
    </div>
  </div>

  <script>
    document.getElementById('rsvp-form').addEventListener('submit', function(e) {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const guests = document.getElementById('guests').value;
      const dietary = document.getElementById('dietary').value.trim() || 'none';

      // Set hidden fields before submit
      document.getElementById('hidden-email').value = email;
      document.getElementById('hidden-subject').value =
        name + ' has RSVP\'d to Summer Gala 2027!';

      // Show success after a short delay (form submits normally)
      setTimeout(function() {
        document.getElementById('rsvp-form').style.display = 'none';
        const s = document.getElementById('success');
        s.style.display = 'block';
        document.getElementById('success-msg').textContent =
          'Thanks, ' + name + '! We\'ll send a confirmation to ' + email + '.';
      }, 500);
    });
  </script>
</body>
</html>
